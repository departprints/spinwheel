<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spinwheel – content dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --s1: #2a78d6; --s2: #eb6834;
  --good: #006300; --wash: rgba(11,11,11,.05);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --s1: #3987e5; --s2: #d95926; --good: #0ca30c; --wash: rgba(255,255,255,.06);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
  --s1: #3987e5; --s2: #d95926; --good: #0ca30c; --wash: rgba(255,255,255,.06);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
h2 { font-size: 15px; margin: 32px 0 12px; font-weight: 650; }
h3 { font-size: 14px; margin: 0; font-weight: 650; }
.sub, .note { color: var(--ink-2); font-size: 13px; margin: 2px 0 0; }
.note { color: var(--muted); }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0 8px; }
select, input[type=search], button { font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
select { min-width: 220px; max-width: 100%; }
button { cursor: pointer; }
button:hover { background: var(--wash); }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 16px; }
.tile, .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 26px; font-weight: 650; margin-top: 2px; }
.tile .delta { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.up { color: var(--good); }

.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.findings li { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 10px 14px; display: flex; gap: 12px; align-items: baseline; }
.chip { flex: none; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2);
  border: 1px solid var(--axis); border-radius: 999px; padding: 1px 8px; min-width: 76px; text-align: center; }

.grid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid .wide { grid-column: 1 / -1; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card header { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
.card header button { font-size: 12px; padding: 2px 8px; flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.legend i.ring { background: none; border: 2px solid var(--s1); }
.legend i.line { height: 2px; width: 14px; border-radius: 0; vertical-align: 3px; }
svg text { fill: var(--muted); font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
svg text.ink { fill: var(--ink-2); }
svg text.val { fill: var(--ink); font-weight: 600; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .axis { stroke: var(--axis); stroke-width: 1; }
svg rect.hit:hover, svg rect.bar:hover { filter: brightness(1.12); }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
th { color: var(--ink-2); font-weight: 600; white-space: nowrap; }
th button { all: unset; cursor: pointer; font-weight: 600; color: var(--ink-2); }
th button:focus-visible { outline: 2px solid var(--s1); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover { background: var(--wash); }
.scroll { overflow-x: auto; }
.vid { display: flex; gap: 10px; align-items: center; min-width: 260px; }
.vid img { width: 64px; height: 36px; object-fit: cover; border-radius: 4px; background: var(--wash); flex: none; }
.flag { display: inline-block; font-size: 11px; white-space: nowrap; color: var(--ink); border: 1px solid var(--axis);
  border-radius: 999px; padding: 0 8px 0 6px; margin: 1px 4px 1px 0; }
.flag::before { content: '◆'; color: var(--s2); margin-right: 4px; }
details.how { margin: 0 0 12px; color: var(--ink-2); font-size: 13px; }
details.how summary { cursor: pointer; }
details.how ul { margin: 6px 0 0; padding-left: 18px; }
.ideas { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.idea-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.idea-top button { font-size: 12px; padding: 2px 10px; }
.idea h3 { margin-bottom: 6px; overflow-wrap: anywhere; }
.why { margin: 0 0 4px; padding-left: 18px; color: var(--ink-2); font-size: 13px; }
.evid, .sugg { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-top: 8px; font-size: 12px; }
button.link { all: unset; cursor: pointer; color: var(--s1); font-size: 12px; text-decoration: underline; }
button.link:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.tag { display: inline-block; font-size: 12px; border: 1px solid var(--grid); border-radius: 6px; padding: 1px 8px; color: var(--ink-2); }
.tag .new { color: var(--ink); font-size: 10px; text-transform: uppercase; margin-left: 6px; }
.seed { margin-top: 14px; }
.seed h4 { display: inline; margin: 0 8px 0 0; font-size: 13px; }
.seed .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.pack { display: grid; gap: 4px 24px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin: 0 0 12px; }
.pack h4 { margin: 8px 0 4px; font-size: 13px; }
.pack ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--surface); padding: 6px 12px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg .count { opacity: .7; margin-left: 6px; font-variant-numeric: tabular-nums; }
.filters .spacer { width: 12px; }
.banner { margin: 8px 0 0; padding: 8px 12px; border: 1px solid var(--axis); border-radius: 8px; font-size: 13px; color: var(--ink-2); }
.tier { display: inline-block; font-size: 11px; font-weight: 650; letter-spacing: .03em; white-space: nowrap; border: 1px solid var(--axis); border-radius: 4px; padding: 0 6px; }
.tier::before { margin-right: 4px; }
.tier-fire { border-color: var(--s2); border-width: 2px; }
.tier-fire::before { content: '▲'; color: var(--s2); }
.tier-outlier { border-color: var(--s1); border-width: 2px; }
.tier-outlier::before { content: '◆'; color: var(--s1); }
.tier-hot::before { content: '●'; color: var(--muted); }
.heat { font-size: 11px; font-weight: 650; letter-spacing: .03em; border: 1px solid var(--axis); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
.heat-trending { border-color: var(--s2); border-width: 2px; }
.heat-active { border-color: var(--s1); border-width: 2px; }
.score { font-variant-numeric: tabular-nums; }
.nav { display: flex; gap: 2px; overflow-x: auto; margin: 14px 0 0; border-bottom: 1px solid var(--grid); }
.nav a { padding: 9px 14px; color: var(--ink-2); text-decoration: none; border-bottom: 2px solid transparent; font-weight: 600; white-space: nowrap; margin-bottom: -1px; }
.nav a:hover { color: var(--ink); background: var(--wash); }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--s1); }
.pagehead h2 { margin-top: 20px; font-size: 18px; }
.flabel { font-size: 11px; border-radius: 4px; padding: 0 6px; white-space: nowrap; border: 1px solid var(--axis); margin-left: 6px; vertical-align: 1px; }
.flabel-faceless { border-color: var(--s1); border-width: 2px; font-weight: 650; }
.flabel-face { color: var(--muted); }
pre.cmd { background: var(--wash); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: 12px; margin: 6px 0; }
.pill { font-size: 11px; color: var(--ink-2); border: 1px solid var(--axis); border-radius: 999px; padding: 0 6px; margin-left: 6px; white-space: nowrap; }
.two { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 820px) { .two { grid-template-columns: minmax(0, 1fr); } }
a { color: var(--s1); }
.changes { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.changes li { font-size: 13px; }
.changes s { color: var(--muted); }

#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--axis); border-radius: 8px; padding: 6px 10px; font-size: 12px; max-width: 280px;
  box-shadow: 0 4px 16px rgba(0,0,0,.18); display: none; }
#tip .t { color: var(--ink-2); margin-bottom: 2px; overflow-wrap: anywhere; }
#tip .r { display: flex; gap: 8px; align-items: center; }
#tip .k { width: 12px; height: 2px; flex: none; }
#tip b { font-weight: 650; }
dialog { background: var(--surface); color: var(--ink); border: 1px solid var(--axis); border-radius: 12px;
  width: min(720px, calc(100vw - 32px)); padding: 16px 20px; }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog .bar { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
footer { margin-top: 40px; color: var(--muted); font-size: 12px; }
@media print { .filters, .card header button { display: none; } }
</style>
</head>
<body>
<main id="app">
  <header class="top">
    <div>
      <h1>Spinwheel</h1>
      <p class="sub" id="fresh"></p>
    </div>
    <button id="theme" type="button" aria-label="Toggle light and dark theme">Theme</button>
  </header>
  <nav class="nav" id="nav" aria-label="Pages"></nav>
  <div id="bar"></div>
  <div id="content"></div>
  <footer id="foot"></footer>
</main>
<div id="tip" role="tooltip"></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>

<script>
const DATA = /*__SPINWHEEL_DATA__*/null;

// ---------------------------------------------------------------- helpers
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
function svg(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function h(tag, props, ...kids) {              // HTML builder; text always via textContent / text nodes
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const trim = (x) => (x >= 100 ? Math.round(x) : x.toFixed(1)).toString().replace(/\.0$/, '');
function fmt(n) {
  if (n == null || isNaN(n)) return '—';
  const a = Math.abs(n), s = n < 0 ? '-' : '';
  if (a >= 1e9) return s + trim(a / 1e9) + 'B';
  if (a >= 1e6) return s + trim(a / 1e6) + 'M';
  if (a >= 1e3) return s + trim(a / 1e3) + 'K';
  return s + Math.round(a);
}
const pct = (x) => (x == null ? '—' : (x * 100).toFixed(1) + '%');
const times = (x) => (x == null ? '—' : (x >= 10 ? x.toFixed(0) : x.toFixed(1)) + '×');
const day = (ms) => new Date(ms).toISOString().slice(0, 10);
const month = (ms) => new Date(ms).toLocaleString('en', { month: 'short', year: '2-digit', timeZone: 'UTC' });
function dur(s) {
  if (s == null) return '—';
  const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
  return hh ? `${hh}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${mm}:${String(ss).padStart(2, '0')}`;
}
const ts = (s) => Date.parse(s.length === 10 ? s + 'T00:00:00Z' : s);
function niceTicks(lo, hi, n = 4) {
  if (lo === hi) { const p = Math.abs(lo) * 0.1 || 1; lo -= p; hi += p; }
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
  const step = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.floor(lo / step) * step; v <= hi + step * 0.999; v += step) out.push(+v.toPrecision(12));
  return out;
}
function logTicks(lo, hi) {
  const a = Math.floor(Math.log10(lo)), b = Math.ceil(Math.log10(hi)), out = [];
  const mult = b - a <= 3 ? [1, 3] : [1];
  for (let e = a; e <= b; e++) for (const m of mult) out.push(m * Math.pow(10, e));
  return out;
}
const lin = (d0, d1, r0, r1) => (v) => d1 === d0 ? (r0 + r1) / 2 : r0 + ((v - d0) / (d1 - d0)) * (r1 - r0);
const ytUrl = (id) => 'https://www.youtube.com/watch?v=' + encodeURIComponent(id);
const safeImg = (u) => (typeof u === 'string' && u.startsWith('https://') ? u : null);

// tooltip -----------------------------------------------------------
const tip = $('tip');
function showTip(x, y, title, rows) {
  tip.textContent = '';
  if (title) tip.append(h('div', { class: 't' }, title));
  for (const r of rows) {
    const k = h('span', { class: 'k' });
    if (r.color) k.style.background = r.color;
    tip.append(h('div', { class: 'r' }, r.color ? k : null, h('b', {}, r.value), r.label ? h('span', {}, r.label) : null));
  }
  tip.style.display = 'block';
  const w = tip.offsetWidth, hh = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(x + 14, innerWidth - w - 8)) + 'px';
  tip.style.top = Math.max(8, Math.min(y + 14, innerHeight - hh - 8)) + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };
function bindTip(el, title, rows) {            // per-mark tooltip, hover and keyboard focus
  el.setAttribute('tabindex', '0');
  el.addEventListener('pointermove', (e) => showTip(e.clientX, e.clientY, title, rows));
  el.addEventListener('pointerleave', hideTip);
  el.addEventListener('focus', () => { const b = el.getBoundingClientRect(); showTip(b.right, b.top, title, rows); });
  el.addEventListener('blur', hideTip);
}
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------------------------------------------------------------- cards
const redraws = [];
function card(title, sub, { wide = false } = {}) {
  const plot = h('div', { class: 'plot' }), tbl = h('div', { class: 'scroll', hidden: true }), legend = h('div', { class: 'legend' });
  const c = { plot, legend, draw: () => {}, table: null };
  const btn = h('button', { type: 'button', 'aria-pressed': 'false' }, 'Table');
  btn.addEventListener('click', () => {
    const on = tbl.hidden;                   // switching to table view
    tbl.hidden = !on; plot.hidden = on; legend.hidden = on;
    btn.setAttribute('aria-pressed', String(on)); btn.textContent = on ? 'Chart' : 'Table';
    if (on) renderTable(); else c.draw();
  });
  function renderTable() {
    tbl.textContent = '';
    if (!c.table) return;
    tbl.append(h('table', {}, h('thead', {}, h('tr', {}, c.table.cols.map((x, i) => h('th', { class: i ? 'n' : '' }, x)))),
      h('tbody', {}, c.table.rows.map((r) => h('tr', {}, r.map((x, i) => h('td', { class: i ? 'n' : '' }, x)))))));
  }
  c.root = h('section', { class: 'card' + (wide ? ' wide' : '') },
    h('header', {}, h('div', {}, h('h3', {}, title), h('p', { class: 'sub' }, sub)), btn), plot, tbl, legend);
  redraws.push(() => { if (!plot.hidden) c.draw(); });
  return c;
}
function frame(plot, height) {
  plot.textContent = '';
  const w = Math.max(plot.clientWidth, 280);
  return { s: svg('svg', { viewBox: `0 0 ${w} ${height}`, width: w, height, role: 'img' }, plot), w };
}
const empty = (plot, msg) => { plot.textContent = ''; plot.append(h('div', { class: 'empty' }, msg)); };

// horizontal bars: rows [{label, value, note, color}] ------------------
function hbars(c, rows, { fmtV = fmt, ref = null } = {}) {
  const { plot } = c;
  if (!rows.length) return empty(plot, 'Not enough data yet.');
  const rowH = 32, top = 6, left = Math.min(150, Math.max(96, plot.clientWidth * 0.3)), right = 74;
  const { s, w } = frame(plot, top + rows.length * rowH + (ref != null ? 20 : 6));
  const max = Math.max(...rows.map((r) => r.value || 0), ref || 0) || 1;
  const x = lin(0, max, left, w - right);
  svg('line', { class: 'axis', x1: left, x2: left, y1: top, y2: top + rows.length * rowH }, s);
  rows.forEach((r, i) => {
    const y = top + i * rowH, bw = Math.max(0, x(r.value || 0) - left);
    const t = svg('text', { class: 'ink', x: left - 8, y: y + rowH / 2 + 4, 'text-anchor': 'end' }, s); t.textContent = r.label;
    if (r.value != null) {
      const g = svg('g', {}, s);
      svg('path', { class: 'bar', d: `M${left},${y + 4}h${Math.max(bw - 4, 0)}a4,4 0 0 1 4,4v${rowH - 16}a4,4 0 0 1 -4,4h-${Math.max(bw - 4, 0)}z`, fill: r.color || 'var(--s1)' }, g);
      const hit = svg('rect', { class: 'hit', x: left, y, width: w - left, height: rowH, fill: 'transparent' }, g);
      bindTip(hit, r.label, [{ value: fmtV(r.value), label: r.note || '', color: r.color || 'var(--s1)' }]);
      const v = svg('text', { class: 'val', x: left + bw + 6, y: y + rowH / 2 + 4 }, s); v.textContent = fmtV(r.value) + (r.n != null ? `  n=${r.n}` : '');
    } else {
      const v = svg('text', { x: left + 6, y: y + rowH / 2 + 4 }, s); v.textContent = r.note || 'no videos';
    }
  });
  if (ref != null) {
    svg('line', { x1: x(ref), x2: x(ref), y1: top, y2: top + rows.length * rowH, stroke: 'var(--ink-2)', 'stroke-width': 1 }, s);
    const t = svg('text', { class: 'ink', x: x(ref), y: top + rows.length * rowH + 14, 'text-anchor': 'middle' }, s); t.textContent = 'channel median';
  }
}

// columns: rows [{label, value, n}] ---------------------------------
function columns(c, rows, { fmtV = fmt, height = 220 } = {}) {
  const { plot } = c;
  if (!rows.some((r) => r.value != null)) return empty(plot, 'Not enough data yet.');
  const { s, w } = frame(plot, height);
  const m = { l: 40, r: 8, t: 22, b: 26 }, ticks = niceTicks(0, Math.max(...rows.map((r) => r.value || 0)), 4);
  const y = lin(0, ticks[ticks.length - 1], height - m.b, m.t), slot = (w - m.l - m.r) / rows.length, bw = Math.min(24, slot - 6);
  ticks.forEach((tk) => {
    svg('line', { class: tk ? 'grid' : 'axis', x1: m.l, x2: w - m.r, y1: y(tk), y2: y(tk) }, s);
    const t = svg('text', { x: m.l - 6, y: y(tk) + 4, 'text-anchor': 'end' }, s); t.textContent = fmtV(tk);
  });
  rows.forEach((r, i) => {
    const cx = m.l + slot * (i + 0.5), x0 = cx - bw / 2;
    const lab = svg('text', { class: 'ink', x: cx, y: height - 8, 'text-anchor': 'middle' }, s); lab.textContent = r.label;
    if (r.value == null) return;
    const bh = Math.max(y(0) - y(r.value), 1), rr = Math.min(4, bh);
    svg('path', { class: 'bar', fill: 'var(--s1)', d: `M${x0},${y(0)}v${-(bh - rr)}a${rr},${rr} 0 0 1 ${rr},${-rr}h${bw - 2 * rr}a${rr},${rr} 0 0 1 ${rr},${rr}v${bh - rr}z` }, s);
    const hit = svg('rect', { class: 'hit', x: cx - slot / 2, y: m.t, width: slot, height: height - m.t - m.b, fill: 'transparent' }, s);
    bindTip(hit, r.label, [{ value: fmtV(r.value), label: r.n != null ? `n=${r.n}` : '', color: 'var(--s1)' }]);
    if (r.n != null && slot > 34) { const v = svg('text', { class: 'val', x: cx, y: y(r.value) - 6, 'text-anchor': 'middle' }, s); v.textContent = fmtV(r.value); }
  });
}

// line over time: pts [{t, v}] --------------------------------------

// diverging lift bars around 1.0× ---------------------------------
function liftBars(c, rows) {
  const { plot } = c;
  if (!rows.length) return empty(plot, 'Not enough data yet.');
  const rowH = 34, top = 24, left = Math.min(190, Math.max(120, plot.clientWidth * 0.36)), right = 56;
  const { s, w } = frame(plot, top + rows.length * rowH + 6);
  const span = Math.max(1, ...rows.map((r) => Math.abs(Math.log2(r.lift || 1)))), x = lin(-span, span, left, w - right), x0 = x(0);
  [-span, 0, span].forEach((e) => {
    svg('line', { class: e ? 'grid' : 'axis', x1: x(e), x2: x(e), y1: top - 4, y2: top + rows.length * rowH }, s);
    const t = svg('text', { x: x(e), y: top - 10, 'text-anchor': 'middle' }, s); t.textContent = times(Math.pow(2, e));
  });
  rows.forEach((r, i) => {
    const y = top + i * rowH, lab = svg('text', { class: 'ink', x: left - 10, y: y + rowH / 2 + 4, 'text-anchor': 'end' }, s);
    lab.textContent = r.label;
    if (r.lift == null) { const t = svg('text', { x: x0 + 8, y: y + rowH / 2 + 4 }, s); t.textContent = 'too few videos to compare'; return; }
    const e = Math.log2(r.lift), xe = x(e), up = e >= 0, col = up ? 'var(--s1)' : 'var(--s2)';
    const bx = Math.min(x0, xe), bw = Math.max(Math.abs(xe - x0), 1);
    svg('rect', { class: 'bar', x: bx, y: y + 7, width: bw, height: rowH - 14, rx: Math.min(4, bw / 2), fill: col }, s);
    const hit = svg('rect', { class: 'hit', x: left, y, width: w - left - right, height: rowH, fill: 'transparent' }, s);
    bindTip(hit, r.label, [{ value: times(r.lift) + ' median views', label: `${r.n_with} with vs ${r.n_without} without`, color: col },
      { value: fmt(r.median_with) + ' vs ' + fmt(r.median_without), label: 'median views' },
      { value: times(r.avg_lift) + ' on averages', label: fmt(r.avg_with) + ' vs ' + fmt(r.avg_without) + ' average views' }]);
    const v = svg('text', { class: 'val', x: up ? xe + 6 : xe - 6, y: y + rowH / 2 + 4, 'text-anchor': up ? 'start' : 'end' }, s); v.textContent = times(r.lift);
  });
}

// scatter: views vs publish date, log y --------------------------------
function scatter(c, vids, median) {
  const { plot } = c;
  const pts = vids.filter((v) => v.published && v.views > 0).map((v) => ({ v, t: ts(v.published), y: v.views }));
  if (pts.length < 2) return empty(plot, 'Not enough videos yet.');

  const ys = pts.map((p) => p.y), lo = Math.min(...ys, median || Infinity), hi = Math.max(...ys, median || 0);
  const ticks = logTicks(lo, hi), y = lin(Math.log10(ticks[0]), Math.log10(ticks[ticks.length - 1]), height - m.b, m.t);
  const t0 = Math.min(...pts.map((p) => p.t)), t1 = Math.max(...pts.map((p) => p.t)), x = lin(t0, t1, m.l + 6, w - m.r - 6);
  ticks.forEach((tk) => {
    svg('line', { class: 'grid', x1: m.l, x2: w - m.r, y1: y(Math.log10(tk)), y2: y(Math.log10(tk)) }, s);
    const t = svg('text', { x: m.l - 6, y: y(Math.log10(tk)) + 4, 'text-anchor': 'end' }, s); t.textContent = fmt(tk);
  });
  for (let i = 0; i < 5; i++) {
    const tv = t0 + ((t1 - t0) * i) / 4, t = svg('text', { x: x(tv), y: height - 8, 'text-anchor': i === 0 ? 'start' : i === 4 ? 'end' : 'middle' }, s);
    t.textContent = month(tv);
  }
  if (median) {
    svg('line', { x1: m.l, x2: w - m.r, y1: y(Math.log10(median)), y2: y(Math.log10(median)), stroke: 'var(--ink-2)', 'stroke-width': 1 }, s);
    const t = svg('text', { class: 'ink', x: w - m.r - 4, y: y(Math.log10(median)) - 5, 'text-anchor': 'end' }, s); t.textContent = 'channel median ' + fmt(median);
  }
  const kind = (v) => (!v.mature ? 'young' : v.score >= DATA.outlier_x ? 'outlier' : 'typical');
  const dots = pts.map((p) => {
    const k = kind(p.v), cx = x(p.t), cy = y(Math.log10(p.y));
    const el = svg('circle', { cx, cy, r: 5, 'stroke-width': 2,
      fill: k === 'young' ? 'var(--surface)' : k === 'outlier' ? 'var(--s2)' : 'var(--s1)',
      stroke: k === 'young' ? 'var(--s1)' : 'var(--surface)' }, s);
    return { p, cx, cy, el };
  });
  const ov = svg('rect', { x: m.l, y: m.t, width: w - m.l - m.r, height: height - m.t - m.b, fill: 'transparent', style: 'cursor:pointer' }, s);
  const sel = svg('circle', { r: 9, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 1.5, visibility: 'hidden' }, s);
  let near = null;
  ov.addEventListener('pointermove', (e) => {
    const b = s.getBoundingClientRect(), px = e.clientX - b.left, py = e.clientY - b.top;
    near = dots.reduce((a, d) => (Math.hypot(d.cx - px, d.cy - py) < Math.hypot(a.cx - px, a.cy - py) ? d : a));
    if (Math.hypot(near.cx - px, near.cy - py) > 40) { near = null; sel.setAttribute('visibility', 'hidden'); return hideTip(); }
    sel.setAttribute('cx', near.cx); sel.setAttribute('cy', near.cy); sel.setAttribute('visibility', 'visible');
    const v = near.p.v;
    showTip(e.clientX, e.clientY, v.title, [{ value: fmt(v.views) + ' views', label: (v.score != null ? times(v.score) + ' median' : 'under ' + DATA.mature_days + ' days old') + (v.views_per_sub != null ? ` · ${times(v.views_per_sub)} subs` : '') + (mode === 'all' && v.format === 'short' ? ' · Short' : ''), color: 'var(--s1)' },
      { value: v.published.slice(0, 10), label: dur(v.duration_s) }]);
  });
  ov.addEventListener('pointerleave', () => { near = null; sel.setAttribute('visibility', 'hidden'); hideTip(); });
  ov.addEventListener('click', () => near && openVideo(near.p.v));
}

}

function audienceSection(d) {
  const wrap = h('div'), min = DATA.comment_min_views.toLocaleString('en');
  if (!d.comment_videos) {
    wrap.append(h('section', { class: 'card' }, h('h3', {}, 'Comments'),
      h('p', { class: 'sub' }, `Comments are fetched for long-form videos with more than ${min} views, so you only pay for the ones with enough audience to say something.`),
      h('p', { class: 'empty' }, mode === 'short' ? 'Comments are fetched for long-form videos only. Add --include-shorts to python -m spinwheel comments to fetch Shorts too.'
        : `None fetched for ${NOUN[mode]} yet. Run: python -m spinwheel comments --min-views ${DATA.comment_min_views}`)));
    return wrap;
  }
  wrap.append(h('p', { class: 'note', style: 'margin:0' }, `From the top-level comments of ${d.comment_videos} video${d.comment_videos === 1 ? '' : 's'}, most liked first, the channel's own comments excluded. “vs typical” compares a comment's likes with the median comment under the same video. Click a row to open its video.`));
  wrap.append(commentCard('Content requests', 'Comments asking for a video: “can you make…”, “part 2 please”, “what about…”.', d.requests, 'No request stands out in the comments fetched.'));
  const un = d.questions_answered + d.questions_unknown + d.unanswered.length;
  wrap.append(commentCard('Unanswered questions', `Questions (a question mark, 4+ words) with no reply from the channel among the replies fetched. ${d.questions_answered} answered, ${d.questions_unknown} unknown (fetched without replies). Only the first few replies per thread are fetched, so “unanswered” means none seen, not proof.`,
    d.unanswered, un && !d.questions_answered && d.questions_unknown ? 'Replies were not fetched, so answered or not is unknown. Re-run python -m spinwheel comments (replies are on by default).' : 'Every question in the comments fetched has a reply from the channel, or none was asked.'));
  wrap.append(commentCard('Most-liked comments', 'The comments the audience agreed with most, whatever they say.', d.top_liked, 'No comments fetched.', { kind: true }));
  return wrap;
}

// breakouts across channels ----------------------------------------
function breakoutTable() {
  const chan = Object.fromEntries(CH().map((c) => [c.id, c]));
  const rows = BRK().map(([cid, vid]) => ({ c: chan[cid], v: DET()[cid].videos.find((x) => x.id === vid) })).filter((r) => r.v);
  const open = (v) => () => openVideo(v);
  return h('section', { class: 'card', style: 'margin-top:12px' },
    h('h3', {}, 'Breakouts across channels'),
    h('p', { class: 'sub' }, `Videos older than ${DATA.mature_days} days, ranked by views per subscriber: who got far more views than their audience size would suggest. A flag on a small channel is the best candidate to study.`),
    h('div', { class: 'scroll' }, h('table', {},
      h('thead', {}, h('tr', {}, ['Video', 'Channel', 'Subscribers', 'Views', 'Views ÷ subs', 'vs channel median', 'Flags'].map((x, i) => h('th', { class: i > 1 ? 'n' : '' }, x)))),
      h('tbody', {}, rows.map(({ c, v }) => h('tr', { class: 'row', tabindex: '0', onclick: open(v), onkeydown: (e) => e.key === 'Enter' && openVideo(v) },
        h('td', {}, v.title), h('td', {}, c.title), h('td', { class: 'n' }, fmt(v.subs)), h('td', { class: 'n' }, fmt(v.views)),
        h('td', { class: 'n' }, times(v.views_per_sub)), h('td', { class: 'n' }, times(v.score)), h('td', { class: 'n' }, flagsOf(v))))))));
}

// video detail ------------------------------------------------------
function commentsBlock(v) {
  const c = DATA.comments[v.id];
  if (!c) return v.views > DATA.comment_min_views ? h('p', { class: 'note', style: 'margin-top:12px' }, 'Comments not fetched yet. Run: python -m spinwheel comments') : null;
  return h('div', {}, h('h3', { style: 'margin-top:12px' }, 'Top comments'),
    h('p', { class: 'note', style: 'margin:0 0 4px' }, `${c.n} top-level comments fetched ${c.at}, most liked first. ${c.asks} read as a question or request.`),
    h('ul', { class: 'changes' }, c.top.map((t) => h('li', {}, t.kind ? h('span', { class: 'pill', style: 'margin:0 6px 0 0' }, t.kind) : null, t.text, h('span', { class: 'note' }, `  ${fmt(t.likes)} likes`)))));
}
function openVideo(v) {
  const dlg = $('dlg'); dlg.textContent = '';
  const plot = h('div', { class: 'plot' }), c = { plot };
  dlg.append(...[
    h('div', { class: 'bar' }, h('div', {}, h('h2', { id: 'dlg-title', style: 'margin:0' }, v.title),
      h('p', { class: 'sub' }, `${(v.published || '').slice(0, 10)} · ${v.format === 'short' ? 'Short' : 'Long-form'} · ${dur(v.duration_s)} · ${fmt(v.views)} views · ${v.score != null ? times(v.score) + ' channel median' : 'too new to score'}${v.subs != null ? ` · channel has ${fmt(v.subs)} subscribers (${times(v.views_per_sub)})` : ''}`),
      h('div', {}, flagsOf(v))),
      h('button', { type: 'button', onclick: () => dlg.close() }, 'Close')),
    h('p', {}, h('a', { href: ytUrl(v.id), target: '_blank', rel: 'noopener noreferrer' }, 'Open on YouTube')),
    h('h3', {}, 'Views at each pull'), plot,
    commentsBlock(v),
    v.title_changes.length ? h('div', {}, h('h3', { style: 'margin-top:12px' }, 'Title history'), h('ul', { class: 'changes' }, v.title_changes.map((t) => h('li', {}, h('s', {}, t.from), ' → ', h('b', {}, t.to), h('span', { class: 'note' }, `  ${t.at.slice(0, 10)}`))))) : null,
  ].filter(Boolean));
  dlg.showModal();
  lineChart(c, (DATA.history[v.id] || []).map((p) => ({ t: ts(p[0]), v: p[1] })), { height: 200, label: 'views' });
}
$('dlg').addEventListener('click', (e) => { if (e.target === $('dlg')) $('dlg').close(); });

// theme + resize ----------------------------------------------------
$('theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('spinwheel-theme', next); } catch (e) {}
});
try { const t = localStorage.getItem('spinwheel-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
let rz; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => redraws.forEach((f) => f()), 120); }).observe($('app'));
addEventListener('hashchange', () => { if (HAS()) { pickChannel(); render(); } });

if (HAS()) pickChannel();
render();
$('foot').textContent = DATA && DATA.generated_at ? `Built ${DATA.generated_at.replace('T', ' ').replace('Z', ' UTC')} from your local spinwheel database.` : '';
</script>
</body>
</html>
